name: Synthetic runtime and policy tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Test and build the dependency-free Go worker
        working-directory: runtime-go
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          go test ./...
          go vet ./...
          go build -trimpath -o ../artifacts/runtime-go/shield-correlate ./cmd/shield-correlate
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m openshield --help
