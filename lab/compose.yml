name: openshield-lab
services:
  app:
    image: python:3.12-slim@sha256:7a8b475003c4fe15a2cd4e55e5cfc2f3560bdc9333d624f24cdd6d4340fd7a17
    command: ["python", "/lab/app.py"]
    labels:
      org.openshield.lab.fixture-source: ${SHIELD_LAB_APP_REV:?set by control.py}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - .:/lab:ro
      - ${SHIELD_LAB_STATE:?set by control.py}/app:/state
    networks: [private]
  proxy:
    image: openshield-lab-caddy:pinned
    command: ["run", "--resume", "--config", "/config/caddy.json"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /persist
      XDG_DATA_HOME: /tmp
    volumes:
      - ${SHIELD_LAB_STATE:?set by control.py}/config:/config:ro
      - ${SHIELD_LAB_STATE:?set by control.py}/admin:/admin
      - ${SHIELD_LAB_STATE:?set by control.py}/persist:/persist
    ports: ["127.0.0.1:18780:8080"]
    networks: [private, ingress]
    depends_on: [app]
  broker:
    image: python:3.12-slim@sha256:7a8b475003c4fe15a2cd4e55e5cfc2f3560bdc9333d624f24cdd6d4340fd7a17
    command: ["python", "-c", "import time; time.sleep(86400)"]
    user: "10001:10001"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - .:/lab:ro
      - ${SHIELD_LAB_STATE:?set by control.py}/admin:/admin
  observer:
    image: python:3.12-slim@sha256:7a8b475003c4fe15a2cd4e55e5cfc2f3560bdc9333d624f24cdd6d4340fd7a17
    command: ["python", "-c", "import time; time.sleep(86400)"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes: [".:/lab:ro"]
    networks: [private]
networks:
  private:
    internal: true
  ingress: {}
